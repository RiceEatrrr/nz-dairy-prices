name: Scrape GDT Prices

on:
  schedule:
    - cron: '0 9 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pkgs-${{ hashFiles('**/scrape.R') }}
          restore-keys: r-pkgs-

      - name: Install R packages
        run: |
          install.packages(c("rvest", "dplyr", "tidyr", "stringr", "readr"))
        shell: Rscript {0}

      - name: Run scrape
        run: Rscript scrape.R

      - name: Commit updated CSV
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/gdt_prices.csv
          git diff --staged --quiet || git commit -m "GDT prices update $(date +'%Y-%m-%d')"
          git push